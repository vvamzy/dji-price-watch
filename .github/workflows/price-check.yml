name: price-check

on:
  schedule:
    # Every 5 minutes (GitHub's floor). Actual start is best-effort and often
    # a few minutes late under load. Per-store cadence is enforced in code.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending email or writing state'
        type: boolean
        default: true
      force:
        description: 'Ignore per-store poll cadence'
        type: boolean
        default: true
      test_email:
        description: 'Send a test email and exit (set dry_run to false)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

env:
  DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
  FORCE: ${{ inputs.force && '1' || '0' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Jitter
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 45))

      - name: Check prices
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: node src/index.js ${{ inputs.test_email && '--test-email' || '' }}

      - name: Persist state
        if: env.DRY_RUN != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- state/prices.json; then
            echo "no state change"
            exit 0
          fi
          git add state/prices.json
          git commit -m "chore(state): price snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash
          git push
